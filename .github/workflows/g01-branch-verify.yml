name: G01 branch verify

on:
  push:
    branches:
      - codex/canonical-source-20261006
    paths:
      - appsrc/package.json
      - appsrc/package-lock.json
      - appsrc/server/financial/**
      - appsrc/tests/g01*.test.mjs
      - supabase/migrations/20261006000*_g01*.sql
      - .github/workflows/g01-branch-verify.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      G01_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify lockfile is deterministic
        working-directory: appsrc
        run: |
          cp package-lock.json /tmp/package-lock.before.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          cmp --silent /tmp/package-lock.before.json package-lock.json || {
            echo "package-lock.json is not synchronized with package.json"
            git --no-pager diff -- package-lock.json
            exit 1
          }

      - name: Clean install
        working-directory: appsrc
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Unit, contract and disposable-Postgres integration tests
        working-directory: appsrc
        run: npm test

      - name: Build
        working-directory: appsrc
        run: npm run build

      - name: Upload verified lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g01-package-lock-${{ github.sha }}
          path: appsrc/package-lock.json
          if-no-files-found: error
          retention-days: 3
