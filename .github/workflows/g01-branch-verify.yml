name: G01 branch verify

on:
  push:
    branches:
      - codex/canonical-source-20261006
    paths:
      - appsrc/package.json
      - appsrc/package-lock.json
      - appsrc/server/financial/**
      - appsrc/tests/g01*.test.mjs
      - supabase/migrations/20261006000*_g01*.sql
      - .github/workflows/g01-branch-verify.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate deterministic app lockfile
        working-directory: appsrc
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Clean install
        working-directory: appsrc
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Unit and contract tests
        working-directory: appsrc
        run: npm test

      - name: Build
        working-directory: appsrc
        run: npm run build

      - name: Commit generated lockfile to working branch
        if: success() && github.actor != 'github-actions[bot]'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if git diff --quiet -- appsrc/package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          current_sha="$(gh api "repos/${REPO}/contents/appsrc/package-lock.json?ref=${BRANCH}" --jq .sha)"
          content="$(base64 -w0 appsrc/package-lock.json)"
          gh api --method PUT "repos/${REPO}/contents/appsrc/package-lock.json" \
            -f message='chore(g01): sync generated package lock' \
            -f content="$content" \
            -f sha="$current_sha" \
            -f branch="$BRANCH" >/dev/null

      - name: Upload generated lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g01-package-lock-${{ github.sha }}
          path: appsrc/package-lock.json
          if-no-files-found: error
          retention-days: 3
