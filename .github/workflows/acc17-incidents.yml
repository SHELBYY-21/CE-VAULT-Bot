name: ACC-17 incident tests
on:
  pull_request:
    paths:
      - 'src/lib/incidents/**'
      - 'tests/acc17-incidents.test.ts'
      - '.github/workflows/acc17-incidents.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  incident-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --experimental-strip-types tests/acc17-incidents.test.ts
