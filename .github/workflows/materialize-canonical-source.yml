name: Materialize Canonical Source

on:
  push:
    branches:
      - codex/canonical-source-20261006
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message || '', '[canonical-source]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/canonical-source-20261006
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Reconstruct and validate current runtime source
        run: npm run build

      - name: Commit materialized source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appsrc
          if git diff --cached --quiet; then
            echo "No canonical-source changes to commit."
            exit 0
          fi
          git commit -m "chore: materialize runtime source [canonical-source]"
          git push origin HEAD:codex/canonical-source-20261006
