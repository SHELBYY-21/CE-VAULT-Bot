name: Supabase integration check

on:
  push:
    branches: [feat/supabase-iuaavi-integration]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-generated-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Verify lockfile is reproducible
        run: npm ci --no-audit --no-fund

      - name: Install bot dependencies
        run: npm ci --no-audit --no-fund
        working-directory: bot

      - name: Validate generated CE VAULT app
        run: npm run build

      - name: Verify Supabase integration markers exist
        run: |
          test -f .env.example.supabase
          test -f .mcp.json
          grep -RIl "supabase" scripts .env.example.supabase .mcp.json >/dev/null
