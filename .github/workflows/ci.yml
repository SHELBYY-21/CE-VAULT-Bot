name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install bot dependencies
        run: npm ci
        working-directory: bot

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  # แทนสถานะ deploy ของ Vercel — ยืนยันว่าโฮสต์เป้าหมายครบใน repo
  hosting:
    name: hosting (Cloudflare / Actions / Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify non-Vercel hosting paths
        run: |
          set -e
          test -f docs/HOSTING.md
          test -f .github/workflows/dashboard-24h.yml
          test -f .github/workflows/bot-24h.yml
          test -f Dockerfile
          test -f docker-compose.yml
          test -f apphosting.yaml
          test ! -f vercel.json
          test ! -d .vercel
          echo "Hosting stack OK — Cloudflare tunnel + GH Actions + Docker (+ Firebase App Hosting optional)"
          echo "Do not use Vercel. Disconnect the Vercel GitHub App if PRs still show a Vercel check."

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install root dependencies
        run: npm ci
      - name: Dependency audit (high severity)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
