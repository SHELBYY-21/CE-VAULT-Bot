name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install bot dependencies
        run: npm ci
        working-directory: bot

      - name: Validate canonical app source
        run: npm run build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install root dependencies
        run: npm ci
      - name: Audit root production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Install app dependencies
        run: npm ci
        working-directory: appsrc
      - name: Audit app production dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: appsrc
      - name: Install bot dependencies
        run: npm ci
        working-directory: bot
      - name: Audit bot production dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: bot
