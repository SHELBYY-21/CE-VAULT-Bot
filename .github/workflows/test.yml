name: Test

# Security gate: production dependencies must remain free of high-severity audit findings.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-build:
    name: Canonical Build & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install bot dependencies
        run: npm ci
        working-directory: bot

      - name: Run canonical generated-app checks
        run: npm run build

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Audit root production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Install bot dependencies
        run: npm ci
        working-directory: bot

      - name: Audit bot production dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: bot
