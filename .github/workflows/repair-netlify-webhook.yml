name: Repair Netlify Telegram webhook

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-netlify-webhook.yml'

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      TARGET_URL: https://zesty-semolina-b169fc.netlify.app/api/telegram/set-webhook
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
    steps:
      - name: Validate bot secret availability
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${BOT_TOKEN:-}" ]; then
            echo '::error::Missing Actions secret BOT_TOKEN'
            exit 1
          fi

      - name: Wait for canonical host and repair webhook
        shell: bash
        run: |
          set -euo pipefail
          repair_key="$(printf 'ce-vault:set-webhook:%s' "$BOT_TOKEN" | sha256sum | awk '{print $1}')"
          body="$(mktemp)"
          success=0

          for attempt in $(seq 1 24); do
            status="$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
              --output "$body" --write-out '%{http_code}' \
              --request POST \
              --header "x-ce-repair-key: ${repair_key}" \
              --header 'content-type: application/json' \
              --data '{}' \
              "$TARGET_URL" || true)"

            if [ "$status" = '200' ]; then
              if node - "$body" <<'NODE'
          const fs = require('fs');
          const json = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (json.ok !== true || !String(json.webhookUrl || '').startsWith('https://zesty-semolina-b169fc.netlify.app/')) process.exit(1);
          console.log(`Webhook verified on canonical Netlify host: ${json.webhookUrl}`);
          NODE
              then
                success=1
                break
              fi
            fi

            echo "Canonical host not ready for repair yet (attempt ${attempt}, HTTP ${status})."
            sleep 10
          done

          if [ "$success" -ne 1 ]; then
            echo '::error::Could not verify Netlify Telegram webhook repair'
            exit 1
          fi
