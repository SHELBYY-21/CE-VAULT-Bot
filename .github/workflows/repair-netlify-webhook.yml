name: Repair Netlify Telegram webhook

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-netlify-webhook.yml'

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WEBHOOK_URL: https://zesty-semolina-b169fc.netlify.app/api/telegram/webhook
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
    steps:
      - name: Validate secret availability
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${BOT_TOKEN:-}" ]; then echo '::error::Missing Actions secret BOT_TOKEN'; missing=1; fi
          if [ -z "${TELEGRAM_WEBHOOK_SECRET:-}" ]; then echo '::error::Missing Actions secret TELEGRAM_WEBHOOK_SECRET'; missing=1; fi
          if [ "$missing" -ne 0 ]; then exit 1; fi

      - name: Rebind and verify Telegram webhook
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.telegram.org/bot${BOT_TOKEN}"
          body="$(mktemp)"

          curl --fail --silent --show-error --connect-timeout 15 --max-time 45 \
            --request POST \
            --header 'content-type: application/json' \
            --data "$(node -e 'process.stdout.write(JSON.stringify({url:process.env.WEBHOOK_URL,secret_token:process.env.TELEGRAM_WEBHOOK_SECRET,allowed_updates:[\"message\",\"edited_message\",\"callback_query\"],drop_pending_updates:false}))')" \
            "${api}/setWebhook" > "$body"

          node - "$body" <<'NODE'
          const fs = require('fs');
          const json = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (json.ok !== true) {
            console.error('Telegram setWebhook failed');
            process.exit(1);
          }
          NODE

          curl --fail --silent --show-error --connect-timeout 15 --max-time 45 \
            "${api}/getWebhookInfo" > "$body"
          node - "$body" <<'NODE'
          const fs = require('fs');
          const json = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const expected = process.env.WEBHOOK_URL;
          if (json.ok !== true || json.result?.url !== expected) {
            console.error('Telegram webhook verification failed');
            process.exit(1);
          }
          console.log(`Webhook verified on canonical Netlify host; pending updates: ${Number(json.result?.pending_update_count || 0)}`);
          NODE
