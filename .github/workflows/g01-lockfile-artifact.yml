name: G01 lockfile artifact

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  generate-lockfile:
    if: github.head_ref == 'codex/canonical-source-20261006'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: appsrc/package-lock.json
      - name: Generate app lockfile only
        working-directory: appsrc
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - uses: actions/upload-artifact@v4
        with:
          name: g01-package-lock
          path: appsrc/package-lock.json
          if-no-files-found: error
